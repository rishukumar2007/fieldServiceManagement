spring.application.name=fieldServiceManagement

# Server Port
server.port=8080

# H2 In-Memory Database (Default for instant execution & zero-setup testing)
spring.datasource.url=jdbc:h2:mem:keystonedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway Database Migration Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Secret & Expiration Configuration
keystone.app.jwtSecret=keystoneFieldServiceManagementSuperSecretKey2026WithSufficientBitsForHMACSHA256Signature!
keystone.app.jwtExpirationMs=86400000

