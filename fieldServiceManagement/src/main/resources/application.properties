spring.application.name=fieldServiceManagement

# Server Port
server.port=8080

# H2 In-Memory Database (Default for instant local execution & zero-setup testing)
spring.datasource.url=jdbc:h2:mem:keystonedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# MySQL / PostgreSQL Production Properties (Uncomment for production MySQL connection)
